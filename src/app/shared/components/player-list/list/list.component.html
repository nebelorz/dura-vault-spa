<div class="rest-list">
  @for (item of items(); track item.id; let i = $index) {
    <div
      class="list-row animation-fade"
      [ngClass]="item.rowClass ?? ''"
      (click)="itemClick.emit(item)"
      (contextmenu)="itemRightClick.emit({ event: $event, item: item }); $event.preventDefault()"
    >
      <span class="list-rank text-subvalue text-muted">{{ rankOffset() + i + 1 }}</span>
      <div class="list-info">
        <span class="list-name text-value">{{ item.name }}</span>
        <div class="list-meta-row">
          <span class="list-meta text-subvalue">{{ item.meta }}</span>
          @if (item.badge; as badge) {
            <app-badge [text]="badge.text" [variant]="badge.variant" />
          }
        </div>
      </div>
      <div class="list-metrics">
        @for (col of item.columns; track $index) {
          <app-metric-display
            [abbreviate]="col.abbreviate ?? true"
            [displayValue]="col.displayValue"
            [iconSize]="col.iconSize ?? 'sm'"
            [iconTooltip]="col.iconTooltip"
            [labelTooltip]="col.labelTooltip"
            [layout]="col.layout ?? 'column'"
            [metric]="col.metric"
            [relativePercentagePointsFromTotal]="col.relativePercentagePointsFromTotal"
            [showIcon]="col.showIcon ?? true"
            [showLabel]="col.showLabel ?? false"
            [showSign]="col.showSign ?? false"
            [size]="col.size ?? 'sm'"
            [subValue]="col.subValue"
            [subValueTooltip]="col.subValueTooltip"
            [tooltipPosition]="col.tooltipPosition ?? 'top'"
            [value]="col.value"
            [valueClass]="col.valueClass"
            [valueTooltip]="col.valueTooltip"
          />
        }
      </div>
    </div>
  } @empty {
    <div class="list-empty-row text-subvalue text-muted">{{ emptyMessage() }}</div>
  }
</div>
