<span class="metric-display" [ngClass]="[colorClass(), 'metric-display--' + layout()]">
  <!-- ICON -->
  @if (showIcon()) {
    <i
      [ngClass]="[iconClass(), 'metric-display--icon-' + iconSize()]"
      [pTooltip]="iconTooltip()"
      [tooltipPosition]="tooltipPosition()"
    ></i>
  }
  <!-- VALUE -->
  @if (value() !== undefined || displayValue() !== undefined) {
    <span
      class="metric-display--value"
      [ngClass]="[valueSizeClass(), colorClass(), valueClass() ?? '']"
      [pTooltip]="valueTooltip()"
      [tooltipPosition]="tooltipPosition()"
    >
      {{ formattedValue() }}
    </span>
  }
  <!-- SHORT LABEL -->
  @if (showShortLabel()) {
    <span
      class="metric-display--short-label text-caption"
      [pTooltip]="labelTooltip()"
      [tooltipPosition]="tooltipPosition()"
    >
      {{ metricDef().shortLabel }}
    </span>
  }
  <!-- LABEL -->
  @if (showLabel()) {
    <span
      class="metric-display--label text-caption"
      [pTooltip]="labelTooltip()"
      [tooltipPosition]="tooltipPosition()"
    >
      {{ metricDef().label }}
    </span>
  }
  <!-- SUB VALUE -->
  @if (resolvedSubValue(); as sub) {
    <span
      class="metric-display--sub-value text-subvalue"
      [pTooltip]="subValueTooltip()"
      [tooltipPosition]="tooltipPosition()"
    >
      {{ sub }}
    </span>
  }
</span>
