<div
  class="stat-card"
  [class.stat-card--muted]="muted()"
  [class.stat-card--link]="!!link()"
  [pTooltip]="tooltip()"
  tooltipPosition="bottom"
>
  @if (link(); as href) {
    <a
      class="stat-card__link"
      [routerLink]="href"
      [queryParams]="queryParams()"
      queryParamsHandling="merge"
    ></a>
  }
  @if (hasImage()) {
    <img [src]="imageSrc()!" class="stat-image" [class.stat-image--muted]="muted()" alt="" />
  } @else if (hasIcon()) {
    <i [class]="icon()!" class="stat-icon" [class.text-muted]="muted()" [style.color]="accentColor()"></i>
  }
  <span class="text-label" [class.text-muted]="muted()">{{ label() }}</span>
  <span class="text-value" [class.text-muted]="muted()">{{ value() }}</span>
  @if (sublabel()) {
    <span class="text-subvalue" [class.text-muted]="muted()" [style.color]="sublabelColor()">{{
      sublabel()
    }}</span>
  }
  <ng-content select="[cardFooter]" />
</div>
