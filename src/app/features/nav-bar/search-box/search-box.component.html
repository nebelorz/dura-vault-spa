<div class="search-box-container">
  <i class="pi pi-search search-box-icon"></i>
  <p-floatlabel variant="on">
    <input
      id="search_character_input"
      pInputText
      pSize="small"
      type="text"
      autocomplete="off"
      (keydown.enter)="onSearch($event)"
    />
    <label for="search_character_input">Search character</label>
  </p-floatlabel>
</div>
