@if (loading()) {
  <app-loading-status />
} @else {
  @if (stats(); as statsSummary) {
    <div class="stats-row animation-fade">
      <app-stat-card
        icon="pi pi-star-fill"
        [value]="statsSummary.topVocation ? statsSummary.topVocation.name : '—'"
        label="Most Active Vocation"
        [tooltip]="
          statsSummary.topVocation
            ? statsSummary.topVocation.hoursDisplay + ' total hours'
            : 'No data'
        "
        [muted]="!statsSummary.topVocation"
      />
      <app-stat-card
        icon="pi pi-chart-bar"
        [value]="statsSummary.topLevelBracket ? statsSummary.topLevelBracket.label : '—'"
        label="Most Active Level Range"
        [muted]="!statsSummary.topLevelBracket"
      />
      <app-stat-card
        icon="pi pi-calendar"
        [value]="statsSummary.peakDay ? statsSummary.peakDay.date : '—'"
        label="Most Active Day"
        [tooltip]="
          statsSummary.peakDay ? statsSummary.peakDay.hoursDisplay + ' total hours' : 'No data'
        "
        [muted]="!statsSummary.peakDay"
      />
    </div>
  }

  <div class="charts-grid">
    <app-online-activity-by-vocation-chart [data]="data()" [loading]="loading()" />
    <app-online-activity-by-level-chart [data]="data()" [loading]="loading()" />
    <app-online-activity-by-period-chart
      [timeline]="timeline()"
      [period]="period()"
      [loading]="loading()"
    />
  </div>
}
