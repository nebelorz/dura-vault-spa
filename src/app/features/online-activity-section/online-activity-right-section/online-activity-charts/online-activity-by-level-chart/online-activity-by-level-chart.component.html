@if (levelChartData(); as data) {
  <section class="chart-section animation-fade">
    <div class="sub-section-header">
      <span class="sub-section-label">Activity by Level Range</span>
    </div>
    <div class="chart-container">
      <p-chart type="bar" [data]="data" [options]="levelChartOptions()" />
    </div>
  </section>
}
