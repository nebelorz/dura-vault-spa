<div class="section-shell animation-fade">
  <!-- Header -->
  <div class="section-header">
    <app-online-header />

    <div class="selector-group">
      <app-period-selector
        [selectedPeriod]="selectedPeriod()"
        (periodChange)="onPeriodChange($event)"
      />
      <app-date-range-label [dateRange]="dateRange()" />
    </div>
  </div>

  <!-- Body: left (podium + list) | right (stats + charts) -->
  @if (scrapeError()) {
    <app-error-status (retry)="retry()" [disabled]="retrying()" />
  } @else {
    <div class="section-body">
      <div class="section-left">
        <app-online-activity-data-table
          [data]="data()"
          [loading]="loading()"
          [error]="topError()"
          [disabled]="retrying()"
          [period]="selectedPeriod()"
          (retry)="retry()"
        />
      </div>
      <div class="section-right">
        <app-online-activity-charts
          [data]="data()"
          [timeline]="timeline()"
          [loading]="loading()"
          [topError]="topError()"
          [timelineError]="timelineError()"
          [disabled]="retrying()"
          [period]="selectedPeriod()"
          (retry)="retry()"
        />
      </div>
    </div>
  }
</div>
