<div class="section-shell animation-fade">
  <!-- Header -->
  <div class="section-header">
    <app-highscore-header [section]="section()" />

    <div class="selector-group">
      <app-period-selector
        [selectedPeriod]="selectedPeriod()"
        (periodChange)="onPeriodChange($event)"
      />
      <app-date-range-label [dateRange]="dateRange()" />
    </div>
  </div>

  <!-- Body: left (ranking) | right (stats + charts) -->
  @if (error()) {
    <app-error-status (retry)="retry()" [disabled]="retrying()" />
  } @else {
    <div class="section-body">
      <div class="section-left">
        <app-highscore-data-table [data]="data()" [loading]="loading()" [section]="section()" />
      </div>
      <div class="section-right">
        <app-top-by-vocation-cards [data]="data()" [loading]="loading()" [section]="section()" />
        <app-highscore-chart-gains-by-vocation
          [data]="data()"
          [loading]="loading()"
          [section]="section()"
        />
      </div>
    </div>
  }
</div>
