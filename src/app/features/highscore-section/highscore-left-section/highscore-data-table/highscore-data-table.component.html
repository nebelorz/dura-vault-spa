<p-contextMenu #cm [model]="contextMenuItems" appendTo="body" />

@if (loading()) {
  <app-loading-status />
} @else if (!data().length) {
  <app-no-data-status [message]="'No highscores for ' + section() + ' during this period.'" />
} @else {
  <app-player-list
    [items]="displayItems()"
    (itemClick)="onItemClick($event)"
    (itemRightClick)="onItemRightClick($event)"
  />
}
