<div class="gains-summary">
  <button
    type="button"
    class="gains-item"
    [class.gains-item--disabled]="!isSeriesEnabled('level')"
    [class.gains-item--locked]="isSeriesLocked('level')"
    (click)="toggleSeries('level')"
  >
    <span class="gains-dot gains-dot--level"></span>
    <span class="sub-section-label">{{ section() === 'experience' ? 'LEVEL' : 'SKILL' }}</span>
    <span
      class="text-standard"
      [class.metric--level]="section() === 'experience'"
      [class.metric--skill]="section() !== 'experience'"
    >{{ levelDisplayValue() }}</span>
    <span class="text-subvalue"
      >{{ summary().average_gain_level > 0 ? '+' : '' }}{{ summary().average_gain_level }}/day</span
    >
  </button>
  @if (section() === 'experience') {
    <button
      type="button"
      class="gains-item"
      [class.gains-item--disabled]="!isSeriesEnabled('experience')"
      [class.gains-item--locked]="isSeriesLocked('experience')"
      (click)="toggleSeries('experience')"
    >
      <span class="gains-dot gains-dot--xp"></span>
      <span class="sub-section-label">EXPERIENCE</span>
      <span class="text-standard metric--xp">{{ xpDisplayValue() }}</span>
      <span class="text-subvalue"
        >{{ (summary().average_gain_points ?? 0) > 0 ? '+' : ''
        }}{{ summary().average_gain_points | abbreviateNumber }}/day</span
      >
    </button>
  }
  <button
    type="button"
    class="gains-item"
    [class.gains-item--disabled]="!isSeriesEnabled('rank')"
    [class.gains-item--locked]="isSeriesLocked('rank')"
    (click)="toggleSeries('rank')"
  >
    <span class="gains-dot gains-dot--rank"></span>
    <span class="sub-section-label">RANK</span>
    <span class="text-standard metric--rank">{{ rankDisplayValue() }}</span>
    <span class="text-subvalue"
      >{{ summary().average_gain_rank > 0 ? '+' : '' }}{{ summary().average_gain_rank }}/day</span
    >
  </button>
</div>
