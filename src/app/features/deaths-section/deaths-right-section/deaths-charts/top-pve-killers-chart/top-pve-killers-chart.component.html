<section class="chart-section animation-fade">
  <div class="sub-section-header">
    <span class="sub-section-label">Top PvE Killers</span>
  </div>
  <div class="chart-container">
    @if (chartData(); as data) {
      <p-chart type="bar" [data]="data" [options]="chartOptions()" />
    } @else {
      <app-no-data-status />
    }
  </div>
</section>
